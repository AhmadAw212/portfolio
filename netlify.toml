[build]
  command = "npm run build -- --configuration production"
  publish = "dist/my-portfolio/browser"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Existing prerendered files take precedence; this fallback keeps future Angular
# client-side routes working when opened directly or refreshed.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
