[build]
  command = "npm run build"
  publish = "dist/my-portfolio/browser"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Angular prerenders the public route to index.html; no SPA catch-all is required.
