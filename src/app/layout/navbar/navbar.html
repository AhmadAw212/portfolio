<header class="site-header fixed inset-x-0 top-0 z-50" [class.header-scrolled]="scrolled()">
  <div class="scroll-progress" [style.width.%]="scrollProgress()" aria-hidden="true"></div>
  <nav
    class="mx-auto flex h-18 max-w-7xl items-center justify-between px-5 sm:px-8"
    aria-label="Primary navigation"
  >
    <a
      href="#home"
      class="group flex items-center gap-3 focus-visible:outline-2 focus-visible:outline-offset-4"
      (click)="closeMenu()"
      ><span class="brand-mark">AA</span><span class="brand-name">Ahmad Awada</span></a
    >
    <div class="hidden items-center gap-1 lg:flex">
      @for (item of data.navigation; track item.sectionId) {
        <a
          [href]="'#' + item.sectionId"
          class="nav-link px-3 py-2 text-sm font-semibold text-slate-600 dark:text-slate-400"
          [class.nav-active]="activeSection() === item.sectionId"
          >{{ item.label }}</a
        >
      }
    </div>
    <div class="flex items-center gap-2">
      <button
        type="button"
        class="icon-button"
        (click)="theme.toggle()"
        [attr.aria-label]="
          theme.theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'
        "
      >
        @if (theme.theme() === 'dark') {
          <svg class="nav-icon sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/></svg>
        } @else {
          <svg class="nav-icon moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 15.2A8.6 8.6 0 0 1 8.8 3.8 8.6 8.6 0 1 0 20.2 15.2Z"/></svg>
        }
      </button
      ><button
        type="button"
        class="icon-button menu-button"
        (click)="toggleMenu()"
        aria-controls="mobile-menu"
        [attr.aria-expanded]="menuOpen()"
        aria-label="Toggle navigation menu"
      >
        <span class="menu-glyph" [class.menu-glyph-open]="menuOpen()" aria-hidden="true"><i></i><i></i></span>
      </button>
    </div>
  </nav>
  <div
    id="mobile-menu"
    class="mobile-menu"
    [class.mobile-menu-open]="menuOpen()"
    [attr.aria-hidden]="!menuOpen()"
  >
    @for (item of data.navigation; track item.sectionId) {
      <a [href]="'#' + item.sectionId" (click)="closeMenu()" [attr.tabindex]="menuOpen() ? 0 : -1"
        >{{ item.label }}<span>0{{ $index + 1 }}</span></a
      >
    }
  </div>
</header>
